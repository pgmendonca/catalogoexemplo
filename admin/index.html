<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin · Catálogo Exemplo</title><link rel="stylesheet" href="../styles.css"></head><body><header class="top"><a class="brand" href="../">CATÁLOGO<span>EXEMPLO</span></a><a href="../">← Ver catálogo</a></header><main class="admin"><div id="login"><p class="eyebrow">PAINEL DEMO</p><h1>Gerencie seus produtos.</h1><p class="muted">Demonstração local: nada é enviado para um servidor.</p><form id="login-form"><label>Senha demo<input id="password" type="password" required></label><button class="button" type="submit">Entrar</button><p id="login-error" class="error"></p></form></div><div id="panel" hidden><div class="section-head"><div><p class="eyebrow">ADMINISTRAÇÃO</p><h1>Produtos</h1></div><button id="new" class="button">+ Novo produto</button></div><div class="admin-warning">⚠ Dados salvos somente neste navegador. Troque a senha e migre para banco/autenticação antes de publicar para uso real.</div><div id="list"></div><form id="product-form" hidden><input id="id" type="hidden"><label>Nome<input id="name" required></label><label>Categoria<input id="category" required></label><label>Descrição<textarea id="description" required></textarea></label><div class="form-grid"><label>Preço<input id="price" required placeholder="89,90"></label><label>Tamanhos<input id="sizes" placeholder="P, M, G"></label><label>Cores<input id="colors" placeholder="Preto, bege"></label></div><label>Fotos<input id="photos" type="file" accept="image/*" multiple><small>As imagens ficam salvas localmente neste navegador.</small></label><div id="previews" class="previews"></div><button class="button" type="submit">Salvar produto</button> <button id="cancel" type="button" class="filter">Cancelar</button></form></div></main><script src="../admin.js"></script></body></html>
